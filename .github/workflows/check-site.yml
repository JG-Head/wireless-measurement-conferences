name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate conference data
        run: python3 scripts/validate_conferences.py
      - name: Rebuild and confirm the committed Pages output matches
        run: |
          npm ci
          npm run build
          git diff --exit-code -- docs
      - name: Required Pages files
        run: |
          test -f docs/index.html
          test -f docs/.nojekyll
          test -f docs/favicon.svg
          test -f docs/data/conferences.json
          test -f docs/data/affinity.json
          grep -q 'type="module"' docs/index.html
