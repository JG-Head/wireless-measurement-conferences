name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate conference data and site files
        run: |
          python3 scripts/validate_conferences.py
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/app.js
          test -f docs/.nojekyll
          test -f docs/favicon.svg
